name: Update AI lists

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yaml
      - scripts/update-ai-lists.py
      - scripts/test_ai_lists.py
      - Rullset/AI-Extra.list
      - .github/workflows/update-ai-lists.yml

permissions:
  contents: write

concurrency:
  group: update-ai-lists
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify updater
        run: python3 -m unittest discover -s scripts -p 'test_ai_lists.py'
      - name: Refresh and verify original coverage
        run: python3 scripts/update-ai-lists.py
      - name: Publish changed lists only
        shell: bash
        run: |
          git add -- Rullset/AI-GoogleAI.list Rullset/AI-GPT.list Rullset/AI-Claude.list Rullset/AI-Coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update generated AI rule lists'
          git push
